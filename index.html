<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 하루</title>
<style>
:root{--bg:#f3f1ec;--card:#fffefb;--tx:#1d2420;--sub:#6b736d;--line:#e2dfd6;--ac:#1f6f5c;--acbg:#dcefe9;--hi:#c2410c;--hibg:#fde6da;--mid:#a16207;--midbg:#fdf0c9;--lo:#475569;--lobg:#e5e9ee;--n:#3730a3;--nbg:#e0e0fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a18;--card:#1f2523;--tx:#eceee9;--sub:#98a29b;--line:#2f3733;--ac:#5fc3a6;--acbg:#1f3a33;--hi:#fb923c;--hibg:#3d2a1e;--mid:#facc15;--midbg:#3a321a;--lo:#a8b3c0;--lobg:#2a3038;--n:#a5b4fc;--nbg:#26294a}}
:root[data-theme="dark"]{--bg:#161a18;--card:#1f2523;--tx:#eceee9;--sub:#98a29b;--line:#2f3733;--ac:#5fc3a6;--acbg:#1f3a33;--hi:#fb923c;--hibg:#3d2a1e;--mid:#facc15;--midbg:#3a321a;--lo:#a8b3c0;--lobg:#2a3038;--n:#a5b4fc;--nbg:#26294a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
.bk{all:unset;cursor:pointer;font-size:30px;line-height:1;padding:2px 10px 6px 2px;color:var(--ac)}
.date{color:var(--sub);margin:-6px 2px 14px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:10px}
.tile:focus-visible{outline:2px solid var(--ac)}
.tile .ti{font-size:40px}.tile b{font-size:17px}.tile small{color:var(--sub);font-size:12px;max-width:100%}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus,select:focus{outline:2px solid var(--ac)}
.row{display:flex;gap:8px;margin-top:10px}.g{flex:1}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:var(--bg);cursor:pointer;flex:none}
.btn.s{background:var(--lobg);color:var(--tx);font-weight:500;padding:6px 12px;font-size:14px}
.seg{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.seg button{font:inherit;flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:9px 10px;cursor:pointer}
.seg button.on{background:var(--acbg);color:var(--ac);border-color:var(--ac);font-weight:700}
ul{list-style:none;margin:10px 0 0;padding:0;background:var(--card);border-radius:14px;border:1px solid var(--line)}
ul:empty{display:none}
li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .t{flex:1;min-width:0;word-break:break-word}li small{color:var(--sub);display:block;font-size:12px}
li.done .t{text-decoration:line-through;color:var(--sub)}
.x{all:unset;cursor:pointer;color:var(--sub);padding:4px 8px;font-size:18px}
.x:focus-visible{outline:2px solid var(--ac)}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--ac);flex:none;padding:0}
.chip{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;flex:none;background:var(--lobg);color:var(--lo)}
.p2{background:var(--midbg);color:var(--mid)}.p1{background:var(--hibg);color:var(--hi)}
.sum{display:flex;gap:8px;margin-top:10px}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sum small{display:block;color:var(--sub);font-size:12px}.sum b{font-size:16px}
.in{color:var(--ac)}.out{color:var(--hi)}
.sub{font-weight:700;margin:18px 0 0}
.lab{display:flex;flex-direction:column;gap:4px;flex:1;font-size:13px;color:var(--sub)}
.note{font-size:13px;color:var(--sub);margin:8px 0 0}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.nav b{font-size:17px}
.tb{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;background:var(--card);border-radius:12px}
.tb th{color:var(--sub);font-weight:500;font-size:12px;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
.tb td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--line)}
.tb th:first-child,.tb td:first-child{text-align:left}.tb tr[data-a]{cursor:pointer}
.tb tfoot td{font-weight:700;border-bottom:0;color:var(--ac)}
.ch2{width:100%;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.bo{fill:var(--hi)}.bi{fill:var(--ac)}.ch2 text{fill:var(--sub);font-size:9px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .h{text-align:center;font-size:12px;color:var(--sub)}
.cal button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;min-height:62px;padding:3px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px}
.cal em{font-style:normal;font-size:11px;font-weight:700;border-radius:6px;padding:0 5px}
.cal i{font-style:normal;font-size:11px;font-weight:700;color:var(--hi);min-height:14px}
.cal .sD em{background:var(--midbg);color:var(--mid)}.cal .sN em{background:var(--nbg);color:var(--n)}
.cal .sN{background:color-mix(in srgb,var(--nbg) 35%,var(--card))}
.cal .today{border:2px solid var(--ac)}.cal .pick{outline:3px solid var(--hi)}
.empty{color:var(--sub);text-align:center;padding:16px 0;font-size:14px}
textarea{font:13px/1.4 monospace;width:100%;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.ln{fill:none;stroke:var(--ac);stroke-width:2;stroke-linejoin:round}.dt{fill:var(--ac)}
.gh{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:700}.gh span{margin-left:auto}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{font:inherit;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:7px 13px;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
const K='mylife1',$=s=>document.querySelector(s),app=$('#app');
const seedRt=()=>{let id=1;const g=(n,a)=>({id:id++,n,open:1,ex:a.map(x=>({id:id++,p:x[0],n:x[1],s:3,r:10,w:0}))});
return[g('1번 가슴, 이두',[['가슴','체스트프레스'],['이두','스트레이트바'],['가슴','펙덱플라이'],['이두','아령'],['','복근'],['','런닝']]),g('2번 하체, 맨손운동',[['하체','레그프레스'],['하체','레그컬'],['하체','레그익스텐션'],['등','턱걸이'],['가슴,삼두','팔굽혀펴기'],['','복근']]),g('3번 어깨, 등',[['어깨','숄더프레스'],['등','랫풀다운'],['어깨','사이드레터럴'],['등','시티드로우'],['','복근'],['','런닝']])]};
const def=()=>({todos:[],ledger:[],pen:{y:{}},ret:{y:{}},h:{pen:[],ret:[],ovs:[],chan:[]},assets:[],fx:1400,off:{},sp:{},flip:0,dd:[],cardio:[],str:[],subs:[],wt:[],rt:seedRt()});
let S=def();
try{const r=localStorage.getItem(K);if(r)S=Object.assign(def(),JSON.parse(r))}catch(e){}
const norm=()=>{const o=S.pen||{};if(!o.y){S.pen={y:{}};if(o.c||o.n)S.pen.y[new Date().getFullYear()]={c:+o.c||0,n:+o.n||0}}
if(!S.ret||!S.ret.y)S.ret={y:{}};S.h=Object.assign({pen:[],ret:[],ovs:[],chan:[]},S.h);if(S.cardio&&S.cardio.length){S.str=S.str||[];S.cardio.forEach(x=>S.str.push({id:x.id,n:'런닝',p:'',km:x.k,sp:x.s,tm:x.s>0?Math.round(x.k/x.s*60):0,io:x.t==='야외'?'out':'in',d:x.d}));S.cardio=[]}const gm={'1':'1번 가슴, 이두','2':'2번 하체, 맨손운동','3':'3번 어깨, 등'};(S.rt||[]).forEach(g=>{if(gm[g.n])g.n=gm[g.n]});(S.str||[]).forEach(l=>{if(gm[l.g])l.g=gm[l.g]})};norm();
const save=()=>{try{S.sn=S.sn||{};S.sn[ym]=Math.round(total())}catch(e){}try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const pad=n=>n<10?'0'+n:''+n,iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const now=new Date(),today=iso(now),ym=today.slice(0,7),val=id=>($('#'+id)||{}).value||'';
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원',usd=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),nf=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:4});
const big=w=>{const s=w<0?'-':'',a=Math.abs(Math.round(w)),e=Math.floor(a/1e8),m=Math.floor(a%1e8/1e4);return e?s+e+'억'+(m?' '+m.toLocaleString('ko-KR')+'만':'')+'원':s+won(a)};
const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const wk=iso(mon(now)),days=d=>Math.round((new Date(today+'T00:00')-new Date(d+'T00:00'))/864e5);
const P={todo:'home',money:'home',shift:'home',dday:'home',fit:'home',sub:'home',bk:'home',wt:'fit',pen:'invest',ret:'invest',ovs:'invest',etc:'invest',chan:'invest',tot:'invest',fs:'fit',fc:'fit'};
const T={home:'나의 하루',todo:'오늘의 할일',ledger:'가계부',invest:'투자',pen:'개인연금',ret:'퇴직연금',ovs:'해외투자',etc:'기타',chan:'찬이 자산',tot:'합계',shift:'근무표',dday:'디데이',fit:'운동',sub:'고정지출',money:'돈 관리',bk:'백업/복원'};
const IC={money:'💰',sub:'💳',bk:'💾',wt:'⚖️',todo:'✅',ledger:'💰',invest:'📈',shift:'🌓',dday:'📅',fit:'💪',pen:'🏦',ret:'🧓',ovs:'🌎',etc:'🏠',chan:'👶',tot:'🧮',fs:'🏋️',fc:'🏃'};
let V='home',tt='all',draft={},LM={y:now.getFullYear(),m:now.getMonth()+1},lmode='m',SM={y:now.getFullYear(),m:now.getMonth()+1},selD=null,cur='KRW',ys={pen:now.getFullYear(),ret:now.getFullYear()};
const sum=(a,t)=>a.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
const tile=(v,sm)=>`<button class="tile" data-a="go" data-v="${v}"><span class="ti">${IC[v]}</span><b>${T[v]}</b><small>${sm||''}</small></button>`;
const nav=(o,n)=>{o.m+=n;if(o.m>12){o.m=1;o.y++}if(o.m<1){o.m=12;o.y--}};

/* 할일 */
const CATS={d:'오늘',w:'이번주',m:'이번달',t:'세금·신고',rw:'매주',rm:'매달'};
const done=x=>{const c=x.c||'d';return c==='rw'?x.d===wk:c==='rm'?x.d===ym:!!x.d};
const tlist=()=>S.todos.filter(x=>tt==='all'||(x.c||'d')===tt).sort((a,b)=>done(a)-done(b)||S.todos.indexOf(a)-S.todos.indexOf(b));
const vTodo=()=>{const L=tlist();
return `<div class="tabs">${['all',...Object.keys(CATS)].map(k=>`<button data-a="tab" data-v="${k}" class="${tt===k?'on':''}">${k==='all'?'전체':CATS[k]}</button>`).join('')}</div>
<div class="row"><select id="t-c">${Object.keys(CATS).map(k=>`<option value="${k}" ${(tt==='all'?'d':tt)===k?'selected':''}>${CATS[k]}</option>`).join('')}</select><input id="t-in" class="g" placeholder="할 일" maxlength="80"><button class="btn" data-a="tadd">추가</button></div>
<ul>${L.map(x=>`<li data-i="${x.id}" class="${done(x)?'done':''}"><input type="checkbox" data-a="chk" data-i="${x.id}" ${done(x)?'checked':''}><button class="chip" data-a="tcat" data-i="${x.id}" style="border:0;cursor:pointer;font-family:inherit" aria-label="분류 바꾸기">${CATS[x.c||'d']}</button><span class="t">${esc(x.t)}</span><button class="x" data-a="tmv" data-i="${x.id}" data-v="-1" aria-label="위로">▲</button><button class="x" data-a="tmv" data-i="${x.id}" data-v="1" aria-label="아래로">▼</button><button class="x" data-a="tdel" data-i="${x.id}">✕</button></li>`).join('')}</ul>${L.length?'':'<div class="empty">할 일이 없어요</div>'}
<p class="note">▲▼로 순서를 바꾸고, 항목 옆 분류 버튼(오늘·이번주 등)을 누르면 분류가 바뀔요. 매주·매달 항목은 주/월이 바뀌면 체크가 자동으로 풀려요.</p>`};

/* 가계부 */
const chart=d=>{const mx=Math.max(1,...d.flatMap(x=>[x.a,x.b])),n=d.length,w=300/n,st=Math.ceil(n/8),two=d.some(z=>z.b>0),bw=two?w*.4:w*.7;let s='';
d.forEach((x,i)=>{const ha=x.a/mx*100,hb=x.b/mx*100,x0=i*w+w*.1;s+=`<rect class="bo" x="${x0}" y="${110-ha}" width="${bw}" height="${ha}" rx="1.5"/>`;if(two)s+=`<rect class="bi" x="${x0+bw}" y="${110-hb}" width="${bw}" height="${hb}" rx="1.5"/>`;if(i%st===0)s+=`<text x="${i*w+w/2}" y="126" text-anchor="middle">${x.l}</text>`});
return `<svg class="ch2" viewBox="0 0 300 134">${s}</svg>`+(two?'<p class="note"><span class="in">■ 수입</span> <span class="out">■ 지출</span></p>':'<p class="note"><span class="out">■ 일별 지출</span></p>')};
const vLedger=()=>{const {y,m}=LM,Y=lmode==='y';let h=`<div class="seg"><button data-a="lm" data-v="m" class="${Y?'':'on'}">월별</button><button data-a="lm" data-v="y" class="${Y?'on':''}">1년 요약</button></div><div class="nav"><button class="btn s" data-a="lnav" data-v="-1">‹</button><b>${Y?y+'년':y+'년 '+m+'월'}</b><button class="btn s" data-a="lnav" data-v="1">›</button></div>`;
if(!Y){const k=y+'-'+pad(m),L=S.ledger.filter(x=>x.d.slice(0,7)===k),i=sum(L,'in'),o=sum(L,'out'),t=draft.t||'out',dt=draft.d||(k===ym?today:k+'-01'),nd=new Date(y,m,0).getDate(),ex=L.filter(x=>x.t==='out'),mxE=ex.sort((a,b)=>b.a-a.a)[0];
h+=`<div class="seg" id="lt"><button data-a="lt" data-v="out" class="${t==='out'?'on':''}">지출</button><button data-a="lt" data-v="in" class="${t==='in'?'on':''}">수입</button></div>
<div class="row"><input id="l-m" class="g" placeholder="내용" maxlength="30" value="${esc(draft.m||'')}"><input id="l-a" type="number" inputmode="numeric" placeholder="금액(원)" style="width:116px" value="${draft.a||''}"></div>
<div class="row"><input id="l-d" type="date" class="g" value="${dt}"><button class="btn" data-a="ladd">기록</button></div>
<div class="sum"><div><small>수입</small><b class="in">${won(i)}</b></div><div><small>지출</small><b class="out">${won(o)}</b></div><div><small>잔액</small><b>${won(i-o)}</b></div></div>`+bud(o,k===ym,nd);
h+=chart(Array.from({length:nd},(_,j)=>({l:j+1,a:L.filter(x=>x.t==='out'&&+x.d.slice(8)===j+1).reduce((s,x)=>s+x.a,0),b:0})));
h+=`<ul>${L.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).map(x=>`<li><span class="t">${esc(x.m)}<small>${x.d.slice(5).replace('-','/')}</small></span><b class="${x.t==='in'?'in':'out'}">${x.t==='in'?'+':'-'}${won(x.a)}</b><button class="x" data-a="lcp" data-i="${x.id}" title="복사" aria-label="복사">📋</button><button class="x" data-a="ldel" data-i="${x.id}">✕</button></li>`).join('')}</ul>${L.length?'':'<div class="empty">이 달 기록이 없어요</div>'}`;
h+=`<p class="sub">${m}월 요약</p><p class="note">수입 ${won(i)} · 지출 ${won(o)} (${ex.length}건) · 잔액 ${won(i-o)}<br>하루 평균 지출 ${won(o/(k===ym?now.getDate():nd))}${mxE?'<br>가장 큰 지출 '+esc(mxE.m)+' '+won(mxE.a):''}</p>`}
else{const R=Array.from({length:12},(_,j)=>{const L=S.ledger.filter(x=>x.d.slice(0,7)===y+'-'+pad(j+1));return{l:j+1,b:sum(L,'in'),a:sum(L,'out')}}),ti=R.reduce((s,x)=>s+x.b,0),to=R.reduce((s,x)=>s+x.a,0),act=R.filter(x=>x.a||x.b),mx=act.slice().sort((a,b)=>b.a-a.a)[0];
h+=chart(R)+`<table class="tb"><thead><tr><th>월</th><th>수입</th><th>지출</th><th>잔액</th></tr></thead><tbody>${R.map(x=>`<tr><td>${x.l}월</td><td>${x.b.toLocaleString('ko-KR')}</td><td>${x.a.toLocaleString('ko-KR')}</td><td>${(x.b-x.a).toLocaleString('ko-KR')}</td></tr>`).join('')}</tbody><tfoot><tr><td>1년</td><td>${ti.toLocaleString('ko-KR')}</td><td>${to.toLocaleString('ko-KR')}</td><td>${(ti-to).toLocaleString('ko-KR')}</td></tr></tfoot></table>
<p class="sub">${y}년 요약</p><p class="note">수입 ${won(ti)} · 지출 ${won(to)} · 잔액 ${won(ti-to)}<br>월 평균 지출 ${won(act.length?to/act.length:0)}${mx&&mx.a?'<br>지출이 가장 큰 달 '+mx.l+'월 ('+won(mx.a)+')':''}${ti?'<br>저축률 '+((ti-to)/ti*100).toFixed(1)+'%':''}</p>`}
return h};

/* 투자 */
const YF={pen:[['c','세액공제 받은 금액',1,'공제'],['n','세액공제 안 받은 금액',1,'비공제'],['i','ISA 이전 금액',0,'ISA이전']],ret:[['a','입금액',1,'입금']]};
const nn=x=>(+x||0).toLocaleString('ko-KR');
const ytab=k=>{const F=YF[k],Y=S[k].y,ks=Object.keys(Y).filter(y=>F.some(f=>+Y[y][f[0]]>0)).sort().reverse(),tot={},two=F.filter(f=>f[2]).length>1;
const rows=ks.map(y=>{F.forEach(f=>tot[f[0]]=(tot[f[0]]||0)+(+Y[y][f[0]]||0));const t=F.reduce((s,f)=>s+(f[2]?+Y[y][f[0]]||0:0),0);return `<tr data-a="yj" data-k="${k}" data-v="${y}"><td>${y}년</td>${F.map(f=>`<td>${nn(Y[y][f[0]])}</td>`).join('')}${two?`<td><b>${nn(t)}</b></td>`:''}</tr>`}).join('');

if(last){const ch=last.w-first.w,ws=L.map(x=>x.w);h+=`<div class="sum"><div><small>현재</small><b>${nf(last.w)}kg</b></div><div><small>시작 대비</small><b class="${ch<=0?'in':'out'}">${ch>0?'+':''}${nf(+ch.toFixed(1))}kg</b></div>${g?`<div><small>목표까지</small><b>${nf(+(last.w-g).toFixed(1))}kg</b></div>`:''}</div>`+line(L.slice(-30))+`<p class="note">최저 ${nf(Math.min(...ws))}kg · 최고 ${nf(Math.max(...ws))}kg</p>`}

let FM={y:now.getFullYear(),m:now.getMonth()+1},fd=today,ft='s',it='tot',em=null,tmEnd=0,tmT=null;

S.str.forEach(x=>{(by[x.d]=by[x.d]||[]).push(x)});
let h=`<div class="nav"><button class="btn s" data-a="fnav" data-v="-1">‹</button><b>${y}년 ${m}월</b><button class="btn s" data-a="fnav" data-v="1">›</button></div><div class="cal">${'월화수목금토일'.split('').map(x=>`<div class="h">${x}</div>`).join('')}${'<span></span>'.repeat(first)}`;
for(let d=1;d<=n;d++){const dt=k+'-'+pad(d),c=(by[dt]||[]).length;h+=`<button data-a="fsel" data-d="${dt}" class="${dt===today?'today':''}${dt===fd?' pick':''}"${c?' style="background:var(--acbg)"':''}><span>${d}</span><i style="color:var(--ac)">${c?c+'개':''}</i></button>`}

const D=by[fd]||[],gs=[...new Set(D.map(x=>x.g||''))];
h+=`<p class="sub">${+fd.slice(5,7)}월 ${+fd.slice(8)}일 운동</p>`+(D.length?gs.map(g=>`<p class="note" style="margin-top:12px"><b>${g?'루틴 '+esc(g):'기타'}</b></p><ul>${D.filter(x=>(x.g||'')===g).map(x=>`<li><span class="t">${x.p?esc(x.p)+' / ':''}${esc(x.n)}<small>${fl(x)}</small></span><button class="x" data-a="sdel" data-i="${x.id}">✕</button></li>`).join('')}</ul>`).join(''):'<div class="empty">이 날 기록이 없어요. 운동 탭에서 체크하면 저장돼요</div>');
const L=S.str.filter(x=>x.d.slice(0,7)===k),rn=L.filter(x=>x.km!=null),ws=L.filter(x=>x.km==null),days=new Set(L.map(x=>x.d)).size,sets=ws.reduce((s,x)=>s+(+x.s||0),0),vol=ws.reduce((s,x)=>s+(+x.s||0)*(+x.r||0)*(+x.w||0),0),km=rn.reduce((s,x)=>s+x.km,0),tm=rn.reduce((s,x)=>s+x.tm,0),pt={};
ws.forEach(x=>String(x.p||'').split(',').map(z=>z.trim()).filter(Boolean).forEach(z=>pt[z]=(pt[z]||0)+1));
const wl=S.wt.filter(x=>x.d.slice(0,7)===k).sort((a,b)=>a.d.localeCompare(b.d)),pe=Object.entries(pt).sort((a,b)=>b[1]-a[1]);
return h+`<p class="sub">${m}월 합계</p><div class="sum"><div><small>운동한 날</small><b>${days}일</b></div><div><small>운동 횟수</small><b>${L.length}회</b></div><div><small>총 세트</small><b>${sets}세트</b></div></div><div class="sum"><div><small>총 볼륨</small><b>${nf(vol)}kg</b></div><div><small>런닝</small><b>${rn.length}회</b></div><div><small>달린 거리</small><b>${nf(+km.toFixed(2))}km</b></div></div><p class="note">볼륨 = 중량 × 횟수 × 세트 합계${rn.length?`<br>런닝 총 ${tm}분${tm>0?' · 평균 속력 '+nf(+(km/(tm/60)).toFixed(1))+'km/h':''} · 실내 ${rn.filter(x=>x.io!=='out').length}회 · 실외 ${rn.filter(x=>x.io==='out').length}회`:''}${pe.length?'<br>부위별 '+pe.map(([a,b])=>a+' '+b+'회').join(' · '):''}${wl.length>1?`<br>체중 ${nf(wl[0].w)} → ${nf(wl[wl.length-1].w)}kg (${wl[wl.length-1].w-wl[0].w>0?'+':''}${nf(+(wl[wl.length-1].w-wl[0].w).toFixed(1))}kg)`:''}</p>`};
const vFit=()=>{const dts=new Set(S.str.filter(x=>x.d>=wk).map(x=>x.d)),mk=S.str.filter(x=>x.km>0&&x.d.slice(0,7)===ym).reduce((s,x)=>s+x.km,0),lw=S.wt.slice().sort((a,b)=>a.d.localeCompare(b.d)).pop();
return `<div class="sum"><div><small>이번 주 운동</small><b>${dts.size}일</b></div><div><small>이번 달 달린 거리</small><b>${nf(+mk.toFixed(1))}km</b></div><div><small>현재 체중</small><b>${lw?nf(lw.w)+'kg':'-'}</b></div></div><div class="tabs" style="margin-top:10px">${[['s','운동'],['k','달력'],['w','체중']].map(([k,l])=>`<button data-a="ftab" data-v="${k}" class="${ft===k?'on':''}" style="flex:1">${l}</button>`).join('')}</div>`+(ft==='s'?vFs():ft==='k'?vCal():vWt())};

const render=()=>{app.innerHTML=`<div class="top">${V==='home'?'':'<button class="bk" data-a="back" aria-label="뒤로">‹</button>'}<h1>${T[V]}</h1></div>${V==='home'?`<p class="date">${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${'일월화수목금토'[now.getDay()]}요일</p>`:''}`+VW[V]();

app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,k=b.dataset.k,i=+b.dataset.i,id=b.dataset.id,gi=+b.dataset.g;
const num=s=>+val(s);
switch(a){
case 'go':return go(v);case 'back':return go(P[V]);
case 'tab':tt=v;break;
case 'tadd':{const t=val('t-in').trim();if(!t)return;S.todos.push({id:Date.now(),t,c:val('t-c'),d:0});break}
case 'chk':{const x=S.todos.find(z=>z.id===i),c=x.c||'d';x.d=done(x)?0:c==='rw'?wk:c==='rm'?ym:1;break}
case 'tmv':{const L=tlist(),j=L.findIndex(z=>z.id===i),y=L[j+ +v];if(j<0||!y)return;const a=S.todos.indexOf(L[j]),c=S.todos.indexOf(y);[S.todos[a],S.todos[c]]=[S.todos[c],S.todos[a]];break}
case 'tcat':{const x=S.todos.find(z=>z.id===i),ks=Object.keys(CATS);x.c=ks[(ks.indexOf(x.c||'d')+1)%ks.length];x.d=0;break}
case 'fnav':nav(FM,+v);break;case 'fsel':fd=b.dataset.d;break;

case 'lcp':{const x=S.ledger.find(z=>z.id===i);draft={t:x.t,m:x.m,a:x.a,d:today};LM={y:now.getFullYear(),m:now.getMonth()+1};render();scrollTo(0,0);return}
case 'ldel':S.ledger=S.ledger.filter(x=>x.id!==i);break;
case 'yn':ys[k]+=+v;break;case 'yj':ys[k]=+v;scrollTo(0,0);break;
case 'cur':cur=v;break;
case 'hadd':{const n=val('h-n').trim(),q=num('h-q'),p=num('h-p');if(!n||!(q>0)||val('h-p')===''||!(p>=0))return;S.h[k].push({id:Date.now(),n,q,p});break}

case 'xchk':{const x=S.subs.find(z=>z.id===i);if(xdone(x)){S.ledger=S.ledger.filter(z=>!(z.sid===x.id&&z.pk===x.ck));x.ck=''}else{x.ck=xk(x);S.ledger.push({id:Date.now(),t:'out',a:x.a,m:x.n,d:today,sid:x.id,pk:x.ck})}break}

case 'tm':{tmEnd=+v?Date.now()+v*1000:0;clearInterval(tmT);if(tmEnd)tmT=setInterval(()=>{const e=$('#tm');if(Date.now()>=tmEnd){clearInterval(tmT);tmEnd=0;try{navigator.vibrate([300,100,300])}catch(x){}if(e)e.textContent='끝!'}else if(e)e.textContent=tmTxt()},500);$('#tm').textContent=tmTxt();return}

app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='t-in'){e.preventDefault();app.querySelector('[data-a=tadd]').click()}});
render();
})();
