body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}

button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px}
.go{background:var(--amber);color:#3a2a00;font-weight:700;width:100%;font-size:1.05rem}

.opt.no{border-color:var(--bad);background:#f6dcd6;color:#4a1a10}

.bar i{display:block;height:100%;background:var(--amber);transition:width .3s}
.q{font-size:1.25rem;font-weight:700;margin:0 0 6px}
.quote{font-size:1.2rem;margin:6px 0}
.who{color:var(--sub);font-size:.9rem}
.note{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.92rem}

input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.res{font-size:1.3rem;font-weight:700;color:var(--green);margin-top:10px}

 $("lok").onclick=go;$("lp").onkeydown=e=>{if(e.key==="Enter")go()};
}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(t){return JSON.parse(decodeURIComponent(escape(atob(t.replace(/\s+/g,"")))))}
function exportScreen(id,box,back){
 const p=profs().find(x=>x.id===id);if(!p)return back();
 let s;try{s=id===CUR?S:JSON.parse(lg("chagok_d_"+id)||"{}")}catch(e){s={}}
 let w;try{w=JSON.parse(lg("chagok_w_"+id)||"[]")}catch(e){w=[]}
 s=Object.assign({},s,{hist:(s.hist||[]).slice(-100),okl:(s.okl||[]).slice(-100),dkl:(s.dkl||[]).slice(-100)});
 const code=enc({app:"chagok",v:1,name:p.name,s,w:w.slice(-100)});
 box.innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">${esc(p.name)} 기록 내보내기</h2><p class="sub">아래 긴 글자(코드)를 복사해서 다른 기기의 "가져오기"에 붙여 넣어요. 도감, 점수, 기록이 들어 있어요.</p><textarea id="ec" readonly rows="6" style="width:100%;font-size:.75rem">${code}</textarea><button class="go" id="ecp" style="margin-top:8px">복사하기</button><p class="sub" id="emsg"></p><button class="opt" id="eb" style="text-align:center">돌아가기</button></div>`;
 $("ecp").onclick=()=>{$("ec").select();try{navigator.clipboard.writeText(code).then(()=>{$("emsg").textContent="복사했어요!"},()=>{$("emsg").textContent="글자를 길게 눌러 직접 복사해 주세요."})}catch(e){$("emsg").textContent="글자를 길게 눌러 직접 복사해 주세요."}};
 $("eb").onclick=back;
}
function importScreen(id,box,back){
 const p=profs().find(x=>x.id===id);if(!p)return back();
 box.innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">${esc(p.name)} 기록 가져오기</h2><p class="sub">다른 기기에서 내보낸 코드를 붙여 넣어요. 지금 기록은 코드의 기록으로 바뀌어요.</p><textarea id="ic" rows="6" style="width:100%;font-size:.75rem"></textarea><button class="go" id="iok" style="margin-top:8px">가져오기</button><p class="sub" id="imsg"></p><button class="opt" id="ib" style="text-align:center">돌아가기</button></div>`;
 let sure=false;
 $("iok").onclick=()=>{let o;try{o=dec($("ic").value)}catch(e){o=null}
  if(!o||o.app!=="chagok"||!o.s){sure=false;$("imsg").textContent="코드가 올바르지 않아요. 다시 확인해 주세요.";return}
  if(!sure){sure=true;$("imsg").textContent="지금 기록이 바뀌어요. 한 번 더 누르면 가져와요.";return}
  ls("chagok_d_"+id,JSON.stringify(o.s));ls("chagok_w_"+id,JSON.stringify(o.w||[]));
  if(id===CUR){S=Object.assign(defS(),o.s);normalize();save()}
  $("imsg").textContent="가져왔어요!";setTimeout(back,800)};
 $("ib").onclick=back;
}
function showProfMenu(){
 const p=$("play"),m=me();if(!m)return showStart();$("home").classList.add("hide");p.classList.remove("hide");
 p.innerHTML=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.1rem">${esc(m.name)}님의 프로필</h2><button class="opt" id="pe" style="text-align:center">내 기록 내보내기</button><button class="opt" id="pi" style="text-align:center">내 기록 가져오기</button><button class="opt" id="po" style="text-align:center">다른 프로필로 (나가기)</button><button class="go" id="ph" style="margin-top:10px">처음으로</button></div>`;
 $("pe").onclick=()=>exportScreen(CUR,$("play"),showProfMenu);$("pi").onclick=()=>importScreen(CUR,$("play"),showProfMenu);$("po").onclick=showStart;$("ph").onclick=showHome;
}
$("profbtn").onclick=showProfMenu;
function profPin(id){
 const p=profs().find(x=>x.id===id);if(!p)return sview();
 $("parent").innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">${esc(p.name)} PIN 바꾸기</h2><p class="sub">예전 PIN을 몰라도 새 PIN으로 바꿀 수 있어요.</p><label for="q1">새 PIN (숫자 4자리)</label><input id="q1" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><label for="q2">한 번 더</label><input id="q2" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><button class="go" id="qok" style="margin-top:10px">바꾸기</button><p class="sub" id="qm"></p><button class="opt" id="qb" style="text-align:center">설정으로</button></div>`;
 $("qb").onclick=sview;
 $("qok").onclick=()=>{const a=$("q1").value,b=$("q2").value;
  if(!/^\d{4}$/.test(a)){$("qm").textContent="숫자 4자리로 입력해 주세요.";return}
  if(a!==b){$("qm").textContent="두 번 입력한 PIN이 달라요.";return}
  const L=profs();L.find(x=>x.id===id).pin=a;setProfs(L);$("qm").textContent="바꿨어요!";setTimeout(sview,800)};
}
function deleteProfile(id){
 setProfs(profs().filter(p=>p.id!==id));
 try{["chagok_d_","chagok_w_","chagok_prog_"].forEach(k=>localStorage.removeItem(k+id))}catch(e){}
}
function closeProf(){CUR=null;S=defS();sview()}
function sview(){
 const L=profs();
 const prof=L.length?L.map(p=>`<div class="note"><b>${esc(p.name)}</b><button class="opt" data-a="open" data-id="${p.id}" style="text-align:center;margin-top:6px">이 프로필 설정·기록 열기</button><button class="opt" data-a="exp" data-id="${p.id}" style="text-align:center">내보내기</button><button class="opt" data-a="imp" data-id="${p.id}" style="text-align:center">가져오기</button><button class="opt" data-a="del" data-id="${p.id}" style="text-align:center">프로필 삭제</button></div>`).join(""):"<p>아직 프로필이 없어요. 첫 화면에서 만들어요.</p>";
 $("parent").classList.remove("hide");
 $("parent").innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">🔒 설정</h2>`+det("g1","공부 자료",matHtml())+det("g2","프로필 관리",prof)+det("g3","부모 PIN",`<button class="opt" id="ppin" style="text-align:center">부모 PIN 번호 바꾸기</button>`)+`<button class="go" id="pback">◀ 이전</button></div>`;
 $("parent").querySelectorAll("details").forEach(d=>d.ontoggle=()=>{d.open?OP.add(d.dataset.k):OP.delete(d.dataset.k)});
 const go=f=>()=>{$("parent").classList.add("hide");f()};
 $("pst").onclick=go(()=>showStudy(0,STUDY,toSettings));$("pbq").onclick=go(showBookList);$("pbk").onclick=go(showBooks);$("pk").onclick=go(showKinds);$("ppin").onclick=pchange;$("pback").onclick=pclose;
 const del={};
 $("parent").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const id=b.dataset.id,a=b.dataset.a;
  if(a=="open"){loadProfile(id);pview()}
  else if(a=="pin")profPin(id);
  else if(a=="exp")exportScreen(id,$("parent"),sview);
  else if(a=="imp")importScreen(id,$("parent"),sview);
  else if(a=="del"){if(!del[id]){del[id]=1;b.textContent="정말 지울까요? 한 번 더 눌러요";return}deleteProfile(id);sview()}});
}
function pgate(){
 const has=lg(PK);
 $("parent").innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">🔒 설정</h2><p class="sub">${has?"PIN 4자리를 입력해 주세요.":"처음이에요. 부모님이 쓸 숫자 4자리 PIN을 정해 주세요."}</p><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><button class="go" id="pok" style="margin-top:10px">${has?"확인":"PIN 정하기"}</button><p class="sub" id="pmsg"></p><button class="opt" id="pback" style="text-align:center">돌아가기</button></div>`;
 $("pback").onclick=pclose;
 $("pok").onclick=()=>{const v=$("pin").value;
  if(!/^\d{4}$/.test(v)){$("pmsg").textContent="숫자 4자리로 입력해 주세요.";return}
  if(!has){ls(PK,v);sview();return}
  if(v===has)sview();else $("pmsg").textContent="PIN이 달라요.";};
}
showStart();
</script>
</body>
</html>
