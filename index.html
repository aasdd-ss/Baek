<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>우리 아이 체크리스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: two big progress rings open the page, a three-way tab switcher follows, then pastel category cards with large tap rows. Child check sits on the left, parent confirm box on the right. */
:root{
  --bg:#eef5fb;--card:#ffffff;--ink:#1b2540;--mut:#5f6c88;--line:#d5e1ee;
  --brand:#2f6df0;--brand-ink:#ffffff;--ok:#17a865;--ok-ink:#ffffff;
  --sun:#ffc23d;--sun-ink:#4a3500;--danger:#d93a3a;
  --t0:#ffe6df;--t1:#ddebff;--t2:#dcf5e6;--t3:#ece3ff;--t4:#fff1c9;
  --shade:rgba(10,18,40,.5);
  --f-display:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10162a;--card:#1b2440;--ink:#eef2fc;--mut:#a1aecb;--line:#2f3b60;
  --brand:#6b9bff;--brand-ink:#0d1630;--ok:#38d38b;--ok-ink:#06251a;
  --sun:#ffcf5c;--sun-ink:#3a2a00;--danger:#ff7a7a;
  --t0:#3a2b33;--t1:#233352;--t2:#1f3a31;--t3:#33294f;--t4:#3d3822;
  --shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10162a;--card:#1b2440;--ink:#eef2fc;--mut:#a1aecb;--line:#2f3b60;
  --brand:#6b9bff;--brand-ink:#0d1630;--ok:#38d38b;--ok-ink:#06251a;
  --sun:#ffcf5c;--sun-ink:#3a2a00;--danger:#ff7a7a;
  --t0:#3a2b33;--t1:#233352;--t2:#1f3a31;--t3:#33294f;--t4:#3d3822;
  --shade:rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:clamp(22px,6.4vw,28px);line-height:1.15;min-width:0}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.lock{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700}
.lock.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* progress rings */
.gs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.g{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.g.full{border-color:var(--ok)}
.gt{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:17px}
.ring{position:relative;width:96px;height:96px;max-width:100%}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--line)}
.ring .pr{stroke:var(--brand);stroke-linecap:round}
.g.full .pr{stroke:var(--ok)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:400;font-size:25px;font-variant-numeric:tabular-nums}
.gc{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;text-align:center}
.gc small{color:var(--mut);font-weight:500;font-size:14px}

/* date tile (shows today's month and day) */
.di{display:inline-flex;flex-direction:column;flex:none;width:26px;height:28px;border-radius:6px;border:1.5px solid var(--danger);overflow:hidden;background:var(--card);color:var(--ink);line-height:1;text-align:center;font-family:var(--f-body)}
.di i{background:var(--danger);color:var(--card);font-size:9px;font-style:normal;font-weight:700;padding:2px 0 1px}
.di b{flex:1;display:grid;place-items:center;font-size:14px;font-weight:700}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.tab{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:6px 4px;min-width:0;border-radius:16px;border:2px solid var(--line);background:var(--card);font-family:var(--f-display);font-size:16px}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.legend{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:13px;margin-top:12px;padding-inline:6px}
.editbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:10px 14px;margin-top:12px;font-size:14px}
.cheer{margin-top:14px;text-align:center;font-family:var(--f-display);font-size:22px;color:var(--ok)}

/* category cards and rows */
.cat{border-radius:22px;padding:12px;margin-top:12px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 4px}
.ch h2{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:19px;min-width:0}
.pill{background:var(--card);border-radius:999px;padding:2px 10px;font-family:var(--f-body);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill.today{background:var(--sun);color:var(--sun-ink)}
.cbtns{display:flex;gap:4px;flex:none}
.chip{border:0;background:var(--card);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--mut)}
.chip.arm{background:var(--danger);color:var(--card)}
.none{color:var(--mut);font-size:14px;padding:8px 4px}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
.item{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:58px;background:var(--card);border:2px solid transparent;border-radius:16px;padding:10px 14px;text-align:left;font-size:17px;font-weight:500}
.item:disabled{opacity:.45;cursor:default}
.box{width:32px;height:32px;flex:none;border-radius:10px;border:3px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:700;line-height:1}
.t{min-width:0;overflow-wrap:anywhere}
.item.done .box{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.item.done .t{text-decoration:line-through;color:var(--mut)}
.pbox{flex:none;width:44px;height:44px;border-radius:12px;border:3px solid var(--brand);background:var(--card);color:var(--brand-ink);font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.pbox.on{background:var(--brand)}
.pbox:disabled{border-color:var(--line);border-style:dashed;cursor:default}
.ib{flex:none;width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--mut);display:grid;place-items:center;padding:0;font-size:15px}
.ib.del{color:var(--danger)}

/* parent edit panels */
.edit{background:var(--card);border:2px dashed var(--brand);border-radius:16px;padding:12px;margin-top:12px;font-size:14px}
.add{display:flex;gap:8px;margin-top:8px}
.add input,.add select{flex:1;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:700;white-space:nowrap}
.btn.alt{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.hint{color:var(--mut);font-size:13px;margin-top:8px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px;margin-top:8px;padding:4px 0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}

/* calendar */
.calh{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.calh h2{font-size:22px}
.calh .ib{width:44px;height:44px;font-size:16px}
.stat{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:12px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--ok)}
.stat small{flex-basis:100%;color:var(--mut);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.cal>b{text-align:center;font-size:13px;color:var(--mut)}
.cd{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.1}
.cd small{font-size:12px;font-weight:700}
.cd.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink);font-weight:700}
.cd.today{outline:3px solid var(--brand);outline-offset:1px}
.cd.blank{background:none;border:0}

/* PIN dialog */
.modal{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;z-index:20;
  padding:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:320px;text-align:center}
.sheet>b{font-family:var(--f-display);font-weight:400;font-size:20px}
.sheet input{text-align:center;font-size:26px;letter-spacing:10px;margin-top:12px}
.sheet .add{justify-content:center;margin-top:12px}
.err{color:var(--danger);font-size:14px;min-height:22px;margin-top:6px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<main id="app"></main>
<script>
const KEY='kidcheck_v1';
const nm=['일','월','화','수','목','금','토'];
let S={pin:null,cats:[],items:[],checks:{},days:{},appr:{}};
let unlocked=false,tab='daily',modal=null,err='',armed=null,tl=null,tc=null;
let calY=new Date().getFullYear(),calM=new Date().getMonth();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
['cats','items'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
['checks','days','appr'].forEach(k=>{if(!S[k]||typeof S[k]!=='object')S[k]={}});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const monday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=p=>btoa(unescape(encodeURIComponent('kc:'+p)));
const uid=()=>Math.random().toString(36).slice(2,9);

function dicon(){const n=new Date();return `<span class="di" aria-hidden="true"><i>${n.getMonth()+1}월</i><b>${n.getDate()}</b></span>`}
function todayItems(dt){dt=dt||new Date();return S.items.filter(i=>i.type==='daily'||(i.type==='weekday'&&i.dow===dt.getDay()))}
function mark(dt){dt=dt||new Date();const t=dk(dt),d=S.checks['d'+t]||[],it=todayItems(dt),ok=it.length>0&&it.every(i=>d.includes(i.id));if(ok!==!!S.days[t]){ok?S.days[t]=1:delete S.days[t];save()}}
function dayCount(dt){const d=S.checks['d'+dk(dt)]||[],it=todayItems(dt);return{n:it.filter(i=>d.includes(i.id)).length,t:it.length}}
function weekCount(){let n=0,t=0;const m=monday();for(let j=0;j<7;j++){const dt=new Date(m);dt.setDate(m.getDate()+j);const d=S.checks['d'+dk(dt)]||[];S.items.filter(i=>i.type==='weekday'&&i.dow===dt.getDay()).forEach(i=>{t++;if(d.includes(i.id))n++})}return{n,t}}

function gauge(label,icon,n,t){
  const p=t?Math.round(n/t*100):0,full=t>0&&n===t,C=251.33;
  return `<div class="g${full?' full':''}"><div class="gt">${icon}<span>${label}</span></div>
  <div class="ring" role="img" aria-label="${label} ${n}/${t}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="40" fill="none" stroke-width="12"/>${p?`<circle class="pr" cx="50" cy="50" r="40" fill="none" stroke-width="12" stroke-dasharray="${(C*p/100).toFixed(1)} ${C}"/>`:''}</svg><b>${p}%</b></div>
  <div class="gc">${n}<small> / ${t} 완료</small>${full?' 🎉':''}</div></div>`}

function pbox(x,ds){const k='d'+ds,c=(S.checks[k]||[]).includes(x.id),a=(S.appr[k]||[]).includes(x.id);
  return `<button class="pbox${a?' on':''}" ${c?'':'disabled'} data-a="appr" data-v="${x.id}" data-d="${ds}" aria-label="부모 확인">${a?'✔':''}</button>`}
function grp(x){return S.items.filter(i=>i.type===x.type&&(x.type==='daily'?i.cat===x.cat:i.dow===x.dow))}
function shift(x,d){const g=grp(x),j=g.indexOf(x)+d;if(j<0||j>=g.length)return;const a=S.items.indexOf(x),b=S.items.indexOf(g[j]);[S.items[a],S.items[b]]=[S.items[b],S.items[a]];save()}
function cshift(c,d){const i=S.cats.indexOf(c),j=i+d;if(j<0||j>=S.cats.length)return;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];save()}
function place(o,d){const p=d.split(':');if(p[0]==='c'){o.type='daily';o.cat=p[1];delete o.dow}else{o.type='weekday';o.dow=+p[1];delete o.cat}}
function opts(){return S.cats.map(c=>`<option value="c:${c.id}">${esc(c.name)}</option>`).join('')+nm.map((n,i)=>`<option value="w:${i}">${n}요일</option>`).join('')}
function ext(x){if(!unlocked||tl!==x.id)return '';
  return `<div class="edit"><div class="add"><input id="en" value="${esc(x.text)}" maxlength="40"><button class="btn" data-a="svit" data-v="${x.id}">수정 저장</button></div>
  <div class="add"><button class="btn alt" data-a="mvu" data-v="${x.id}">↑ 위로</button><button class="btn alt" data-a="mvd" data-v="${x.id}">↓ 아래로</button></div>
  <div class="add"><select id="dst">${opts()}</select><button class="btn" data-a="mv" data-v="${x.id}">이동</button><button class="btn" data-a="cp" data-v="${x.id}">복사</button></div></div>`}
function cext(c){if(!unlocked||tc!==c.id)return '';
  return `<div class="edit"><div class="add"><input id="en" value="${esc(c.name)}" maxlength="20"><button class="btn" data-a="svct" data-v="${c.id}">이름 저장</button></div>
  <div class="add"><button class="btn alt" data-a="cmu" data-v="${c.id}">↑ 위로</button><button class="btn alt" data-a="cmd" data-v="${c.id}">↓ 아래로</button><button class="btn" data-a="ccp" data-v="${c.id}">복사</button></div></div>`}

function row(x,dt){
  const ds=dk(dt),fut=ds>dk(new Date()),d=(S.checks['d'+ds]||[]).includes(x.id);
  return `<div class="row"><button class="item${d?' done':''}" ${fut?'disabled':''} data-a="chk" data-v="${x.id}" data-d="${ds}"><span class="box">${d?'✓':''}</span><span class="t">${esc(x.text)}</span></button>${unlocked?`<button class="ib del" data-a="delit" data-v="${x.id}" aria-label="삭제">✕</button><button class="ib" data-a="tl" data-v="${x.id}" aria-label="편집">⋯</button>`:''}${pbox(x,ds)}</div>${ext(x)}`}

function todaySection(){
  const td=new Date(),it=S.items.filter(i=>i.type==='weekday'&&i.dow===td.getDay());
  return `<section class="cat" style="background:var(--t4)"><div class="ch"><h2>${dicon()}<span>이번 주 할 일</span><span class="pill">${nm[td.getDay()]}요일</span></h2></div>${it.length?it.map(x=>row(x,td)).join(''):'<div class="none">오늘 요일에 등록된 할 일이 없어요</div>'}</section>`}

function weekSections(){
  const tk=dk(new Date()),m=monday();let o='';
  for(let i=0;i<7;i++){
    const dt=new Date(m);dt.setDate(m.getDate()+i);
    const w=(i+1)%7,it=S.items.filter(x=>x.type==='weekday'&&x.dow===w),isT=dk(dt)===tk;
    o+=`<section class="cat" style="background:var(--t${i%5});${isT?'outline:3px solid var(--brand);outline-offset:1px':''}"><div class="ch"><h2><span>${nm[w]}요일</span><span class="pill">${dt.getMonth()+1}/${dt.getDate()}</span>${isT?'<span class="pill today">오늘</span>':''}</h2></div>${it.map(x=>row(x,dt)).join('')}${unlocked?`<div class="add"><input id="nw-${w}" placeholder="${nm[w]}요일 할 일 추가" maxlength="40"><button class="btn" data-a="addwd" data-v="${w}">추가</button></div>`:''}${!it.length&&!unlocked?'<div class="none">할 일 없음</div>':''}</section>`}
  return o}

function calHtml(){
  const f=new Date(calY,calM,1),dn=new Date(calY,calM+1,0).getDate(),t=dk(new Date());let c=0,g='';
  for(let i=0;i<f.getDay();i++)g+='<div class="cd blank"></div>';
  for(let d=1;d<=dn;d++){const s=calY+'-'+pad(calM+1)+'-'+pad(d),ok=S.days[s];if(ok)c++;g+=`<div class="cd${ok?' ok':''}${s===t?' today':''}"><span>${d}</span>${ok?'<small>✓</small>':''}</div>`}
  return `<div class="calh"><button class="ib" data-a="cprev" aria-label="이전 달">◀</button><h2>${calY}년 ${calM+1}월</h2><button class="ib" data-a="cnext" aria-label="다음 달">▶</button></div>
  <div class="stat"><span>${calM+1}월에</span><b>${c}일</b><span>달성</span><small>그날 할 일을 모두 체크한 날이에요</small></div>
  <div class="cal">${nm.map(x=>`<b>${x}</b>`).join('')}${g}</div>`}

function render(){
  mark();
  const now=new Date(),dc=dayCount(now),wc=weekCount();
  let h=`<header class="top"><div><h1>✅ 우리 아이 체크리스트</h1><div class="sub">${now.getMonth()+1}월 ${now.getDate()}일 (${nm[now.getDay()]})</div></div>
  <button class="lock${unlocked?' on':''}" data-a="lock">${unlocked?'🔓 편집 끝내기':'🔒 부모 편집'}</button></header>
  <div class="gs">${gauge('오늘 할 일','☀️',dc.n,dc.t)}${gauge('이번 주 할 일',dicon(),wc.n,wc.t)}</div>
  <nav class="tabs"><button class="tab${tab==='daily'?' on':''}" data-a="tab" data-v="daily">☀️ 오늘 할 일</button><button class="tab${tab==='weekly'?' on':''}" data-a="tab" data-v="weekly">${dicon()} 이번 주</button><button class="tab${tab==='cal'?' on':''}" data-a="tab" data-v="cal">🗓️ 달력</button></nav>`;
  if(tab==='cal'){h+=calHtml()}
  else{
    h+=`<div class="legend"><span>왼쪽 칸: 아이 체크</span><span>오른쪽 칸: 부모 확인</span></div>`;
    if(unlocked)h+=`<div class="editbar"><b>🔓 부모 편집 중</b><span>끝나면 '편집 끝내기'를 눌러 잠가 주세요</span></div>`;
    if(tab==='daily'){
      if(dc.t&&dc.n===dc.t)h+=`<div class="cheer">🎉 오늘 모두 끝! 최고예요!</div>`;
      if(unlocked)h+=`<div class="edit"><b>카테고리 추가</b><div class="add"><input id="nc" placeholder="새 카테고리 (예: 🧹 정리)" maxlength="20"><button class="btn" data-a="addcat">추가</button></div><div class="hint">매일 하는 일은 각 카테고리 안에서 추가해요. 요일별 할 일은 '이번 주' 탭에서 추가해요.</div><button class="link" data-a="chpin">PIN 변경</button></div>`;
      if(!S.cats.length)h+=`<div class="empty">${unlocked?'위에서 카테고리를 먼저 추가해 주세요.':'아직 항목이 없어요.<br>부모님이 🔒 잠금을 풀고 추가해 주세요.'}</div>`;
      h+=todaySection();
      const td=new Date();
      S.cats.forEach((c,i)=>{
        const ci=S.items.filter(x=>x.type==='daily'&&x.cat===c.id);
        if(!unlocked&&!ci.length)return;
        h+=`<section class="cat" style="background:var(--t${i%5})"><div class="ch"><h2><span>${esc(c.name)}</span></h2>${unlocked?`<span class="cbtns"><button class="chip" data-a="tc" data-v="${c.id}">⋯ 편집</button><button class="chip${armed===c.id?' arm':''}" data-a="delcat" data-v="${c.id}">${armed===c.id?'정말 삭제?':'삭제'}</button></span>`:''}</div>${cext(c)}`;
        ci.forEach(x=>{h+=row(x,td)});
        if(unlocked)h+=`<div class="add"><input id="ni-${c.id}" placeholder="매일 항목 추가" maxlength="40"><button class="btn" data-a="additem" data-v="${c.id}">추가</button></div>`;
        h+='</section>'});
    }else{
      h+=weekSections();
    }
  }
  if(modal){const setup=!S.pin||modal==='chpin';
    h+=`<div class="modal"><div class="sheet"><b>${setup?'새 PIN 4자리 설정':'부모 PIN 입력'}</b><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN"><div class="err">${err}</div><div class="add"><button class="btn" data-a="pinok">확인</button><button class="btn alt" data-a="pinx">취소</button></div></div></div>`}
  document.getElementById('app').innerHTML=h;
  const p=document.getElementById('pin');if(p)p.focus();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a!=='delcat')armed=null;
  if(a==='tab')tab=v;
  else if(a==='cprev'){calM--;if(calM<0){calM=11;calY--}}
  else if(a==='cnext'){calM++;if(calM>11){calM=0;calY++}}
  else if(a==='lock'){tl=tc=null;if(tab==='cal')tab='daily';if(unlocked)unlocked=false;else{modal=S.pin?'enter':'setup';err=''}}
  else if(a==='chpin'){modal='chpin';err=''}
  else if(a==='pinx'){modal=null}
  else if(a==='pinok'){const val=document.getElementById('pin').value;
    if(!/^\d{4}$/.test(val)){err='숫자 4자리를 입력하세요';render();return}
    if(modal==='enter'){if(hash(val)===S.pin){unlocked=true;modal=null}else{err='PIN이 달라요';render();return}}
    else{S.pin=hash(val);unlocked=true;modal=null;save()}}
  else if(a==='appr'){const k='d'+b.dataset.d,m=S.appr[k]||(S.appr[k]=[]),i=m.indexOf(v);if((S.checks[k]||[]).includes(v)){i<0?m.push(v):m.splice(i,1);save()}}
  else if(a==='chk'){const ds=b.dataset.d,k='d'+ds,l=S.checks[k]||(S.checks[k]=[]),i=l.indexOf(v);
    if(i<0)l.push(v);else{l.splice(i,1);const m=S.appr[k]||[],j=m.indexOf(v);if(j>=0)m.splice(j,1)}
    mark(new Date(ds+'T00:00:00'));save()}
  else if(unlocked){
    if(a==='addcat'){const t=document.getElementById('nc').value.trim();if(t){S.cats.push({id:uid(),name:t});save()}}
    else if(a==='tl'){tl=tl===v?null:v;tc=null}
    else if(a==='tc'){tc=tc===v?null:v;tl=null}
    else if(a==='svit'){const t=document.getElementById('en').value.trim(),x=S.items.find(i=>i.id===v);if(t&&x){x.text=t;save()}tl=null}
    else if(a==='svct'){const t=document.getElementById('en').value.trim(),c=S.cats.find(i=>i.id===v);if(t&&c){c.name=t;save()}tc=null}
    else if(a==='mvu'||a==='mvd'){const x=S.items.find(i=>i.id===v);if(x)shift(x,a==='mvu'?-1:1)}
    else if(a==='cmu'||a==='cmd'){const c=S.cats.find(i=>i.id===v);if(c)cshift(c,a==='cmu'?-1:1)}
    else if(a==='mv'||a==='cp'){const x=S.items.find(i=>i.id===v),d=document.getElementById('dst').value;if(x){if(a==='mv')place(x,d);else{const o={...x,id:uid()};place(o,d);S.items.push(o)}save()}tl=null}
    else if(a==='ccp'){const c=S.cats.find(i=>i.id===v);if(c){const n={id:uid(),name:c.name+' 복사'};S.cats.push(n);S.items.filter(i=>i.type==='daily'&&i.cat===c.id).forEach(i=>S.items.push({...i,id:uid(),cat:n.id}));save()}tc=null}
    else if(a==='addwd'){const t=document.getElementById('nw-'+v).value.trim();if(t){S.items.push({id:uid(),type:'weekday',dow:+v,text:t});save()}}
    else if(a==='additem'){const t=document.getElementById('ni-'+v).value.trim();if(t){S.items.push({id:uid(),cat:v,text:t,type:'daily'});save()}}
    else if(a==='delit'){S.items=S.items.filter(x=>x.id!==v);save()}
    else if(a==='delcat'){if(armed===v){S.cats=S.cats.filter(c=>c.id!==v);S.items=S.items.filter(x=>x.cat!==v);armed=null;save()}else armed=v}}
  render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const i=e.target;
  if(i.id==='pin')document.querySelector('[data-a=pinok]').click();
  else if(i.id==='nc')document.querySelector('[data-a=addcat]').click();
  else if(i.id&&(i.id.startsWith('ni-')||i.id.startsWith('nw-')))i.nextElementSibling.click()}});
render();
</script>

</body></html>
